[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtquant-share"
version = "1.3.0"
description = "Xtreme Quant Share - eXtreme transparent sharing proxy for XtQuant on macOS/Linux"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    {name = "Jason Hu", email = "63170682@qq.com"}
]
keywords = [
    "xtquant",
    "rpyc", 
    "remote",
    "proxy",
    "quant",
    "stock",
    "trading",
    "qmt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "rpyc>=6.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]
datadir = [
    "pandas>=1.0",
    "pyarrow>=6.0",
]
bigqmt = [
    "xtquant-big-convert[redis]",
]

[project.scripts]
xqshare-server = "xqshare.server:main"
xtdata = "xqshare.tools.xtdata:main"
xttrader = "xqshare.tools.xttrader:main"

[project.urls]
Homepage = "https://gitee.com/jdragonhu/xqshare"
Documentation = "https://gitee.com/jdragonhu/xqshare#readme"
Repository = "https://gitee.com/jdragonhu/xqshare"
Issues = "https://gitee.com/jdragonhu/xqshare/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["xqshare*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.example", ".env.example"]
